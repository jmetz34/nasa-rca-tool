<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0B3D91" stroke="#FFF" stroke-width="1"/>
  
  <!-- Outer orbit -->
  <ellipse cx="32" cy="32" rx="25" ry="25" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <!-- Inner orbit -->
  <ellipse cx="32" cy="32" rx="15" ry="15" fill="none" stroke="#FFF" stroke-width="1" stroke-dasharray="1 1"/>
  
  <!-- Central core -->
  <circle cx="32" cy="32" r="6" fill="#FC3D21"/>
  
  <!-- Analysis node points (representing the causal factors) -->
  <circle cx="32" cy="7" r="3" fill="#FFF"/>
  <circle cx="54" cy="32" r="3" fill="#FFF"/>
  <circle cx="32" cy="57" r="3" fill="#FFF"/>
  <circle cx="10" cy="32" r="3" fill="#FFF"/>
  
  <!-- Connecting lines to show relationships -->
  <line x1="32" y1="7" x2="32" y2="26" stroke="#FFF" stroke-width="1.5"/>
  <line x1="54" y1="32" x2="38" y2="32" stroke="#FFF" stroke-width="1.5"/>
  <line x1="32" y1="57" x2="32" y2="38" stroke="#FFF" stroke-width="1.5"/>
  <line x1="10" y1="32" x2="26" y2="32" stroke="#FFF" stroke-width="1.5"/>
</svg>